services:
  # Backend - API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: book-catalog-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - book-catalog-network

  # Frontend - React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: book-catalog-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - book-catalog-network

networks:
  book-catalog-network:
    driver: bridge
